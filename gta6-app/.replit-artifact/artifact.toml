kind = "web"
previewPath = "/"
title = "GTA 6 Countdown"
version = "1.0.0"
id = "artifacts/gta6-countdown"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18390

[services.development]
run = "pnpm --filter @workspace/gta6-countdown run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gta6-countdown", "run", "build" ]
publicDir = "artifacts/gta6-countdown/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18390"
BASE_PATH = "/"
