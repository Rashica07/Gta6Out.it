<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e880ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff50cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="viGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff80ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c000ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text
    x="300"
    y="58"
    text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="38"
    font-weight="900"
    letter-spacing="10"
    fill="url(#titleGrad)"
    filter="url(#glow)"
  >GRAND THEFT AUTO</text>
  <line x1="40" y1="72" x2="235" y2="72" stroke="url(#viGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="365" y1="72" x2="560" y2="72" stroke="url(#viGrad)" stroke-width="1.5" opacity="0.6"/>
  <text
    x="300"
    y="178"
    text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="130"
    font-weight="900"
    letter-spacing="12"
    fill="none"
    stroke="url(#viGrad)"
    stroke-width="3"
    filter="url(#glow2)"
  >VI</text>
  <text
    x="300"
    y="178"
    text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="130"
    font-weight="900"
    letter-spacing="12"
    fill="url(#titleGrad)"
    filter="url(#glow)"
  >VI</text>
</svg>
